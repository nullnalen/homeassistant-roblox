blueprint:
  name: Roblox - Daglig skjermtid-oppsummering
  description: >
    Sender daglig oppsummering med skjermtid og topp 3 spill.
    Krever Roblox Parental Controls-integrasjonen.
  domain: automation
  input:
    summary_time:
      name: Tidspunkt for oppsummering
      default: "20:00:00"
      selector:
        time: {}
    notify_action:
      name: Varsling
      description: Velg og konfigurer varsling-action
      selector:
        action: {}

trigger:
  - platform: time
    at: !input summary_time

action: !input notify_action
