blueprint:
  name: "Roblox: Daglig skjermtid-oppsummering"
  description: >
    Sender en daglig oppsummering med dagens skjermtid og ukens topp 3 spill.
    Krever Roblox Parental Controls-integrasjonen.
  domain: automation
  input:
    screentime_today_sensor:
      name: Skjermtid i dag-sensor
      description: Velg sensor.roblox_*_screen_time_today for barnet
      selector:
        entity:
          integration: roblox_parental
          domain: sensor
    screentime_week_sensor:
      name: Skjermtid denne uken-sensor
      description: Velg sensor.roblox_*_screen_time_this_week for barnet
      selector:
        entity:
          integration: roblox_parental
          domain: sensor
    top_games_sensor:
      name: Topp spill-sensor
      description: Velg sensor.roblox_*_top_games_this_week for barnet
      selector:
        entity:
          integration: roblox_parental
          domain: sensor
    notify_target:
      name: Varslingstjeneste
      description: >
        Navn på notify-tjenesten, f.eks. notify.mobile_app_min_telefon
      selector:
        text:
          prefix: notify.
    child_name:
      name: Barnets navn
      default: "Barnet"
      selector:
        text:
    summary_time:
      name: Tidspunkt for oppsummering
      description: Når skal den daglige oppsummeringen sendes?
      default: "20:00:00"
      selector:
        time:

trigger:
  - platform: time
    at: !input summary_time

action:
  - variables:
      today_min: "{{ states(screentime_today_sensor) | int(0) }}"
      week_min: "{{ states(screentime_week_sensor) | int(0) }}"
      games: "{{ state_attr(top_games_sensor, 'games') or [] }}"
      top3: "{{ games[:3] }}"
      today_str: >
        {% set h = (today_min / 60) | int %}
        {% set m = today_min % 60 %}
        {% if h > 0 %}{{ h }}t {{ m }}min{% else %}{{ m }}min{% endif %}
      week_str: >
        {% set h = (week_min / 60) | int %}
        {% set m = week_min % 60 %}
        {% if h > 0 %}{{ h }}t {{ m }}min{% else %}{{ m }}min{% endif %}
      games_str: >
        {% if top3 %}
          {% for g in top3 %}
          {{ loop.index }}. {{ g.name }} ({{ g.minutes }}min){% if g.blocked %} ⛔{% endif %}

          {% endfor %}
        {% else %}
          Ingen spill registrert
        {% endif %}
  - service: "notify.{{ notify_target }}"
    data:
      title: "📊 Roblox – {{ child_name }} i dag"
      message: >
        I dag: {{ today_str }}
        Denne uken: {{ week_str }}

        Topp 3 spill denne uken:
        {{ games_str }}
