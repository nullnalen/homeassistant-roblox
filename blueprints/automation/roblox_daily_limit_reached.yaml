blueprint:
  name: "Roblox: Varsle naar dagsgrense er naAdd"
  description: >
    Sender push-varsling naar barnet har brukt opp daglig skjermtid paa Roblox.
    Krever Roblox Parental Controls-integrasjonen.
  domain: automation
  input:
    over_limit_sensor:
      name: Over dagsgrensen-sensor
      description: Velg binary_sensor.roblox_*_over_daily_limit for barnet
      selector:
        entity:
          integration: roblox_parental
          domain: binary_sensor
    screentime_sensor:
      name: Skjermtid i dag-sensor
      description: Velg sensor.roblox_*_screen_time_today for barnet
      selector:
        entity:
          integration: roblox_parental
          domain: sensor
    notify_service:
      name: Varslingstjeneste
      description: Full tjenestenavn, f.eks. notify.mobile_app_min_telefon
      selector:
        select:
          custom_value: true
          options: []
    child_name:
      name: Barnets navn
      default: Barnet
      selector:
        text: {}

variables:
  screentime_sensor: !input screentime_sensor
  child_name: !input child_name

trigger:
  - platform: state
    entity_id: !input over_limit_sensor
    from: "off"
    to: "on"

action:
  - service: !input notify_service
    data:
      title: "Roblox: Dagsgrense naAdd"
      message: >
        {% set m = states(screentime_sensor) | int(0) %}
        {% set h = (m / 60) | int %}{% set rem = m % 60 %}
        {{ child_name }} har spilt
        {% if h > 0 %}{{ h }}t {{ rem }}min{% else %}{{ rem }}min{% endif %}
        i dag og naAdd dagsgrensen.
