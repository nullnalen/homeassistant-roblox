blueprint:
  name: Roblox - Varsle naar barn starter spill
  description: >
    Sender push-varsling naar et barn begynner aa spille Roblox.
    Krever Roblox Parental Controls-integrasjonen.
  domain: automation
  input:
    in_game_sensor:
      name: I spill-sensor
      description: Velg binary_sensor.roblox_*_in_game for barnet
      selector:
        entity:
          integration: roblox_parental
          domain: binary_sensor
    notify_action:
      name: Varsling
      description: Velg og konfigurer varsling-action
      selector:
        action: {}
    child_name:
      name: Barnets navn
      default: Barnet
      selector:
        text: {}

trigger:
  - platform: state
    entity_id: !input in_game_sensor
    from: "off"
    to: "on"

action: !input notify_action
