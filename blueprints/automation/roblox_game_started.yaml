blueprint:
  name: Roblox - Varsle når barn starter spill
  description: >
    Sender push-varsling til companion-appen når et barn begynner å spille Roblox.
    Krever Roblox Parental Controls-integrasjonen.
  domain: automation
  input:
    in_game_sensor:
      name: I spill-sensor
      description: Velg binary_sensor for barnet (I spill)
      selector:
        entity:
          integration: roblox_parental
          domain: binary_sensor
    notify_device:
      name: Telefon å varsle
      description: Velg telefonen som skal motta varslingen
      selector:
        device:
          integration: mobile_app
    child_name:
      name: Barnets navn
      default: Barnet
      selector:
        text: {}

variables:
  child_name: !input child_name
  in_game_sensor: !input in_game_sensor

trigger:
  - platform: state
    entity_id: !input in_game_sensor
    from: "off"
    to: "on"

action:
  - device_id: !input notify_device
    domain: mobile_app
    type: notify
    title: "Roblox"
    message: >
      {{ child_name }} startet
      {{ state_attr(in_game_sensor, 'game') or 'et ukjent spill' }}
