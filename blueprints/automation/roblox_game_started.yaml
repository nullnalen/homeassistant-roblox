blueprint:
  name: "Roblox: Varsle naar barn starter spill"
  description: >
    Sender push-varsling naar et barn begynner aa spille Roblox.
    Krever Roblox Parental Controls-integrasjonen.
  domain: automation
  input:
    in_game_sensor:
      name: I spill-sensor
      description: Velg binary_sensor.roblox_*_in_game for barnet
      selector:
        entity:
          integration: roblox_parental
          domain: binary_sensor
    notify_service:
      name: Varslingstjeneste
      description: Full tjenestenavn, f.eks. notify.mobile_app_min_telefon
      selector:
        select:
          custom_value: true
          options: []
    child_name:
      name: Barnets navn
      default: Barnet
      selector:
        text: {}

variables:
  in_game_sensor: !input in_game_sensor
  child_name: !input child_name

trigger:
  - platform: state
    entity_id: !input in_game_sensor
    from: "off"
    to: "on"

action:
  - service: !input notify_service
    data:
      title: Roblox
      message: >
        {{ child_name }} startet
        {{ state_attr(in_game_sensor, 'game') or 'et ukjent spill' }}
