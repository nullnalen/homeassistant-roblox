blueprint:
  name: Roblox - Varsle naar barn spiller blokkert spill
  description: >
    Sender push-varsling naar integrasjonen oppdager at et blokkert spill
    har faatt ny spilletid siden forrige poll.
    Krever Roblox Parental Controls-integrasjonen.
  domain: automation
  input:
    blocked_sensor:
      name: Spiller blokkert spill-sensor
      description: Velg binary_sensor.roblox_*_playing_blocked_game for barnet
      selector:
        entity:
          integration: roblox_parental
          domain: binary_sensor
    notify_action:
      name: Varsling
      description: Velg og konfigurer varsling-action
      selector:
        action: {}

trigger:
  - platform: state
    entity_id: !input blocked_sensor
    to: "on"

action: !input notify_action
